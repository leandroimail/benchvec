# BenchVec — Fast Test Profile
# Max 5000 entries, batch 1000, target <5 minutes for all A1-B4 workloads
# Uses not-lain/wikipedia-small-3000-embedded (public, no HF_TOKEN needed)

project_name = "benchvec-fast"
seed = 42

[paths]
data_dir = ".data"
benchmark_dir = ".benchmarks"
cache_dir = ".cache"

[dataset]
primary = "fast_wikipedia"
fallback_enabled = true
seed = 42
sample_size = 5000
ground_truth_k = 100
ground_truth_query_count = 100
min_text_characters = 64
chunk_size = 256
chunk_overlap = 32
local_embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
cohere_dataset_name = "Cohere/wikipedia-22-12-simple-embeddings"
cohere_dataset_config = "en"
cohere_split = "train"
fast_wikipedia_dataset_name = "not-lain/wikipedia-small-3000-embedded"
fast_wikipedia_split = "train"
simple_wikipedia_name = "wikipedia"
simple_wikipedia_config = "20220301.simple"
huggingface_token_env_var = "HF_TOKEN"

[engines]
enabled = ["faiss", "chromadb", "lancedb"]
distance_metric = "l2"
faiss_index_type = "flat"
faiss_nlist = 64

[workloads]
repetitions = 3
warmup_queries = 10
k_values = [10]
ingest_batch_sizes = [1000]
ingest_rates_per_second = [100]
concurrent_workers = [1]
