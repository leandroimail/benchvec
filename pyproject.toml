[project]
name = "benchvec"
version = "0.1.0"
description = "Reproducible benchmark suite for embedded vector databases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3.0",
  "pyyaml>=6.0.1,<7.0",
  "pyarrow>=17.0.0,<19.0.0",
  "psutil>=6.0.0,<7.0.0",
  "numpy>=1.26.4,<2.0.0",
  "scipy>=1.11.0",
  "pandas>=2.2.2,<3.0.0",
  "chonkie>=0.5.1",
  "datasets>=2.20.0,<4.0.0",
  "sentence-transformers>=3.0.1,<4.0.0",
  "faiss-cpu>=1.13.0,<2.0.0",
  "chromadb>=1.0.0,<2.0.0",
  "lancedb>=0.30.0,<1.0.0",
  "typer>=0.12.3,<0.13.0",
  "rich>=13.8.0,<14.0.0",
  "matplotlib>=3.9.0,<4.0.0",
  "seaborn>=0.13.0,<1.0.0",
  "sqlite-vec>=0.1.6",
  "turbovec>=1.0.0,<2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "ruff>=0.6.4,<0.7.0",
  "mypy>=1.11.1,<2.0.0",
  "types-psutil>=7.0.0.20250822",
  "types-pyyaml>=6.0.12.20250809"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "chromadb",
  "chromadb.*",
  "faiss",
  "faiss.*",
  "lancedb",
  "lancedb.*",
  "pandas",
  "pandas.*"
]
ignore_missing_imports = true

